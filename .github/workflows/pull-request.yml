name: Publish Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  publish-preview:
    name: Publish preview
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Get version info
        id: version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          PR_NUMBER=${{ github.event.pull_request.number }}
          VERSION="${BASE_VERSION}-pr.${PR_NUMBER}.${SHORT_SHA}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "tag=pr-${PR_NUMBER}" >> $GITHUB_OUTPUT

      - name: Build package
        run: npm run build
        env:
          PI_PACK_VERSION: ${{ steps.version.outputs.version }}

      - name: Setup npm auth
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Publish preview to npm
        run: npm run publish-package -- --mode=preview --pr=${{ github.event.pull_request.number }} --version=${{ steps.version.outputs.version }}

      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-build
          message: |
            ## 🔨 PR Build Ready!

            | | |
            |---|---|
            | **Commit** | `${{ steps.version.outputs.short_sha }}` |
            | **Version** | `${{ steps.version.outputs.version }}` |

            ### Install preview

            ```bash
            npm install -g pi-pack@pr-${{ steps.version.outputs.pr_number }}
            npx pi-pack@pr-${{ steps.version.outputs.pr_number }} --version
            ```

            <sub>🤖 This comment updates automatically with each push.</sub>
